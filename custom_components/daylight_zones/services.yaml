turn_on:
  fields:
    zone: &zone
      required: true
      selector:
        device:
          integration: daylight_zones
          multiple: true
turn_off:
  fields:
    zone: *zone
    until:
      selector:
        select:
          options: [noon]
    transition:
      selector:
        number: {min: 0, max: 300, unit_of_measurement: s}
toggle:
  fields:
    zone: *zone
set_override:
  fields:
    zone: *zone
    level:
      selector:
        number: {min: 0, max: 100, unit_of_measurement: "%"}
    until:
      default: noon
      selector:
        select:
          options: [next_phase, noon, duration]
    duration:
      selector:
        duration: {}
clear_override:
  fields:
    zone: *zone
toggle_override:
  fields:
    zone: *zone
