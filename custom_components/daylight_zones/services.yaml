auto_on:
  fields:
    zone: &zone
      required: true
      selector:
        device:
          integration: daylight_zones
          multiple: true
auto_off:
  fields:
    zone: *zone
    transition:
      selector:
        number: {min: 0, max: 300, unit_of_measurement: s}
auto_toggle:
  fields:
    zone: *zone
override_on:
  fields:
    zone: *zone
    level:
      selector:
        number: {min: 0, max: 100, unit_of_measurement: "%"}
    until:
      default: noon
      selector:
        select:
          options: [next_phase, noon, duration]
    duration:
      selector:
        duration: {}
override_off:
  fields:
    zone: *zone
override_toggle:
  fields:
    zone: *zone
